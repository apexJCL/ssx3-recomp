# game.toml: what xboxrecomp-cli needs to know about SSX 3. The CLI reads
# it on every command; every key and its default is in the CLI's
# docs/manifest.md. Written by `xbr new`; the CLI never writes it again.
schema = 1

[game]
name = "SSX 3"
slug = "ssx3"

[xbe]
path = "game_files/default.xbe"
# The certificate's title ID: `package` refuses a dump with another one.
title_id = 0x4541003C
# Known dumps (sha256 of default.xbe); empty accepts any dump.
sha256 = []

[cli]
# The xboxrecomp-cli ./ssx3 runs: the bootstrap clones it at this release
# tag (or commit) when it finds none; with both, the commit locks the tag.
# `ssx3 pins refresh` prints the newest release.
tag = "v0.17.0"
commit = "af5649d15fedb09eac8fd76f05f55edd39816e42"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
# `ssx3 setup` clones it into external/xboxrecomp at this commit. A
# release tag pins it too: tag = "..." (branch is then optional).
url = "https://github.com/apexJCL/xboxrecomp.git"
branch = "blinx2/portability"
tag = "blinx2-v0.10.0"
commit = "a0c51a5c2db4ce0d2dcc4091552fc2d0a0e56f99"

[toolchain]
# The llvm-mingw release the windows target cross-compiles with, on every host.
llvm_mingw = "20260922"

[pipeline]
# Stamped into every generated file: fixed for the life of the game.
game_name = "SSX 3"
gen = "src/recomp/gen"
out = "analysis"
# Function starts the disassembler missed (ICALL failures at runtime).
seeds = ["config/seed_functions.json"]
# The toolkit's icall_feedback database belongs to another game: off.
icall_seeds = false
exclude_manual = "src/recomp_manual.c"

[pipeline.disasm]
# Every code section: without the XDK sections (D3D, DSOUND, XGRPH, ...)
# there are no function boundaries there, and their internal calls become
# stubs. A title whose XBE flags data sections executable sets
# text_only = true and names its code sections in extra_sections.
text_only = false

[build]
# The CMake target and file name: build-win/ssx3_recomp.exe
exe = "ssx3_recomp"
# windows builds on every host (llvm-mingw); macos builds on a Mac (Apple
# clang). Drop one to stop `build` offering it.
targets = ["windows", "macos"]
# Passed on every packaging configure so a cache cannot keep a non-stock
# value: the enhancements layer on, every key stock unless a player's
# config.toml or the environment says otherwise.
# The APU DSP is compiled in and runs by default (RECOMP_APU_DSP=0: the stub).
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-DXBOXRECOMP_APU_DSP=ON"]

[data]
game_files = "game_files"
dir_env = "SSX3_DATA_DIR"
windows = "%LOCALAPPDATA%\\Ssx3"
steamos = "~/Games/Ssx3"
macos = "~/Library/Application Support/Ssx3"

[input]
script_env = "RECOMP_INPUT_SCRIPT"

[golden]
# The golden scenarios. Their reference frames (game output) stay under
# the ignored analysis/: never in git, never published. The pad routes are
# input timing inlined in golden.json.
json = "config/golden/golden.json"
frames = "analysis/golden/frames"

[package]
# A private bundle with the player's own dump inside, for Windows, the
# SteamOS-like Linux PC (both from the windows build) and the Mac. Not
# "SSX3": the launcher <app>.exe sits beside ssx3_recomp.exe, and the name
# is the data folder too.
app = "Ssx3"
product = "ssx3-recomp"
targets = ["windows", "steamos", "macos"]
# macos: Ssx3.app in a DMG, with the Homebrew dylibs the Mac build links
# (otool -L build/ssx3_recomp: SDL2 through sdl2-compat, which loads SDL3,
# OpenSSL and libepoxy); the launcher and Info.plist are the game's own, in
# packaging/macos/.
brew = ["sdl2", "sdl3", "openssl", "libepoxy"]
dylib_companions = ["libSDL3.dylib=brew:sdl3"]
content = "packaging"
templates = "packaging"
icon = "xbe"

# The player build wizard (the CLI's docs/wizard.md). No [[wizard.fetch]]
# entries: the CLI fetches the toolkit and llvm-mingw itself by the pins in
# [cli], [toolkit] and setup-pins.json.
[wizard]
repo = "https://github.com/apexJCL/ssx3-recomp"
targets = ["windows", "steamos", "macos"]

# The wizard's open-source credits: this repo is mine, listed first, before
# the CLI's repos.
[[wizard.credit]]
name = "ssx3-recomp"
role = "this recompilation of SSX 3 for PC and Mac"
license = "MIT"
url = "https://github.com/apexJCL/ssx3-recomp"
own = true

# Only the basic tweaks: everything else (filter, pacing) is in
# config.default.toml, which the Options page points to.
[[wizard.option]]
key = "scale"
label = "Render scale"
hint = "Draws the game sharper on a big screen; needs a faster graphics card."
kind = "range"
# The toolkit's render.scale stops at 4 (SCALE_MAX in src/enhance/enhance.c).
min = 1
max = 4
default = 1
config = "render.scale"
labels = { "1" = "640×480, as on the Xbox", "2" = "1280×960", "3" = "1920×1440", "4" = "2560×1920, the sharpest" }

[[wizard.option]]
key = "fullscreen"
label = "Start fullscreen"
kind = "bool"
default = false
config = "present.fullscreen"

# The public repo (the CLI's docs/layout.md): `ssx3 public init` once per
# clone, then each round `ssx3 public export` and the push it prints. The
# private notes, the patterns and the rewrite rules stay out of it.
[public]
url = "git@github.com:apexJCL/ssx3-recomp.git"
author = "carlos <4037632+apexJCL@users.noreply.github.com>"
